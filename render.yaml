services:
  - type: web
    name: dandi-bot-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend_requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DANDI_CORS_ORIGINS
        value: https://dandi-bot.pages.dev
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
