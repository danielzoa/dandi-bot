[build]
  command = "git clone https://github.com/flutter/flutter.git -b stable --depth 1 /opt/buildhome/flutter && export PATH=\"$PATH:/opt/buildhome/flutter/bin\" && flutter config --enable-web && flutter pub get && flutter build web --release"
  publish = "build/web"

[[redirects]]
  from = "/api/tradingview/*"
  to = "https://scanner.tradingview.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
